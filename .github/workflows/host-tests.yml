name: host-tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  host-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build

      - name: Configure
        run: cmake -S host_test -B host_test/build -DCMAKE_BUILD_TYPE=Debug -GNinja

      - name: Build
        run: cmake --build host_test/build -j

      - name: Test
        run: ctest --test-dir host_test/build --output-on-failure

      - name: Upload ctest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-linux
          path: host_test/build/Testing/Temporary/
          if-no-files-found: ignore

  host-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S host_test -B host_test/build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build host_test/build -j

      - name: Test
        run: ctest --test-dir host_test/build --output-on-failure
